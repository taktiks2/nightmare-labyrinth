[package]
name = "nightmare-labyrinth"
version = "0.1.0"
edition = "2021"

[features]
dev = [
  # Improve compile times for dev builds by linking Bevy as a dynamic library.
  "bevy/dynamic_linking",
  "bevy/bevy_dev_tools",
]

[dependencies]
bevy = "0.16.1"
bevy-inspector-egui = "0.31.0"
bevy_aseprite_ultra = "0.5.0"
bevy_asset_loader = { version = "0.23.0", features = [
  "2d",
  "standard_dynamic_assets",
] }
bevy_common_assets = { version = "0.13.0", features = ["json", "ron"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
bevy = { version = "0.16.1", features = ["bevy_dev_tools"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
